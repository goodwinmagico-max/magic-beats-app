name: Build Magic Beats APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository manually
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.ref_name }}
          git checkout FETCH_HEAD

      - name: Set up Java & Android SDK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Flutter Manually
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.19.6 --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor --android-licenses || true
          flutter doctor

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicBeats-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
