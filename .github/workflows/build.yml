name: Build Magic Beats APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/cirruslabs/flutter:3.19.6
    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .

      - name: Find Project Root and Build
        run: |
          # Ищем, в какой папке лежит pubspec.yaml
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 3 -exec dirname {} \;)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          
          echo "Found project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Устанавливаем зависимости и собираем APK
          flutter pub get
          export org.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicBeats-App-Release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
