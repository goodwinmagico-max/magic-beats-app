name: Build Magic Beats APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/cirruslabs/flutter:3.19.6
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory /__w/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/$(echo ${{ github.repository } | cut -d'/' -f2})
          git clone https://github.com/${{ github.repository }}.git .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicBeats-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
