name: Build Magic Beats APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/cirruslabs/flutter:3.19.6
    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git project

      - name: Install Dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          export org.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicBeats-App-Release
          path: project/build/app/outputs/flutter-apk/app-release.apk
